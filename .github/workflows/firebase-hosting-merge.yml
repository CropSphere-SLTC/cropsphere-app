# Deploy the Flutter web build to the live Firebase Hosting site.
#
# Originally generated by the Firebase CLI as a Node.js template (`npm ci`,
# no build step) — rewritten for Flutter. firebase.json lives in frontend/
# and serves build/web, so the app must be built before the deploy action
# runs, and the action must be pointed at frontend/ to find its config.

name: Deploy to Firebase Hosting on merge

# Chained off CI Pipeline's own completion rather than push. Push-triggered,
# this ran concurrently with CI and could publish before CI had a verdict —
# branch protection on main was never configured either, so nothing was
# actually enforcing "merge only after CI passes".
#
# workflow_run has no paths: filter, so the frontend-only condition that push
# used to give for free is re-checked explicitly in the first job step below.
#
# workflow_run always reads its trigger definition from the DEFAULT branch,
# so this only takes effect once this file itself is on main.
on:
  workflow_run:
    workflows: ["CI Pipeline"]
    types: [completed]
    branches: [main]
  workflow_dispatch:    # manual redeploy, bypasses both the CI gate and the
                         # frontend-changed check deliberately

# Only ever one deploy to the live channel at a time. Not cancel-in-progress:
# interrupting an upload mid-flight can leave the site on a partial release.
concurrency:
  group: firebase-hosting-live
  cancel-in-progress: false

permissions:
  contents: read
  actions: read    # workflow_run needs this to read the triggering run's info

jobs:
  build_and_deploy:
    name: 🚀 Build & deploy to live
    runs-on: ubuntu-latest
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          # Pin the exact commit CI validated, not whatever main currently
          # points at.
          ref: ${{ github.event.workflow_run.head_sha || github.ref }}
          # paths-filter (next step) needs history back to the CI run's
          # parent to diff against; a shallow clone can't do that.
          fetch-depth: 0

      - name: Check whether frontend changed
        if: github.event_name != 'workflow_dispatch'
        id: filter
        uses: dorny/paths-filter@v3
        with:
          base: ${{ github.event.workflow_run.head_sha }}~1
          ref: ${{ github.event.workflow_run.head_sha }}
          filters: |
            frontend:
              - 'frontend/**'
              - '.github/workflows/firebase-hosting-merge.yml'

      # A step that "skips" only ends itself successfully — it does not stop
      # the steps after it, so every step from here on repeats this same
      # condition rather than relying on one guard step earlier in the job.
      - name: Set up Flutter
        if: github.event_name == 'workflow_dispatch' || steps.filter.outputs.frontend == 'true'
        uses: subosito/flutter-action@v2
        with:
          # 3.44.8 (Dart 3.12.2), the version this build is verified against.
          # ci.yml and feature-check.yml still pin 3.41.9 — see the note in the
          # PR review; all three should be reconciled to one version.
          flutter-version: "3.44.8"
          channel: stable
          cache: true

      - name: Install dependencies
        if: github.event_name == 'workflow_dispatch' || steps.filter.outputs.frontend == 'true'
        run: flutter pub get

      - name: Build web bundle
        if: github.event_name == 'workflow_dispatch' || steps.filter.outputs.frontend == 'true'
        # AppConfig.baseUrl picks the Railway backend from Uri.base.host, so
        # the build needs no --dart-define to reach production.
        run: flutter build web --release

      - name: Deploy to Firebase Hosting
        if: github.event_name == 'workflow_dispatch' || steps.filter.outputs.frontend == 'true'
        uses: FirebaseExtended/action-hosting-deploy@v0
        # entryPoint is required: defaults.working-directory applies to `run`
        # steps only, never to actions, so without it the action looks for
        # firebase.json at the repo root and finds nothing.
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_CROPSPHERE_2E87C }}
          channelId: live
          projectId: cropsphere-2e87c
          entryPoint: frontend
