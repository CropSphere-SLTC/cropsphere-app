
name: CI Pipeline

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]
    types: [opened, synchronize, reopened]
  workflow_dispatch:    # manual trigger from GitHub UI

# Cancel in-progress runs on new push to same branch
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Least privilege for GITHUB_TOKEN: read-only by default. Jobs that need more
# (CodeQL analysis, SARIF upload) request the extra scope explicitly.
permissions:
  contents: read

jobs:
  # ═══════════════════════════════════════════════════
  # STAGE 1 — Shared security (runs first, blocks all)
  # ═══════════════════════════════════════════════════

  secret-scan:
    name: 🔐 Secret Scanning (TruffleHog)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false   # don't leave the token in .git/config

      - name: Run TruffleHog
        uses: trufflesecurity/trufflehog@v3.94.3
        with:
          path: ./
          base: ${{ github.event.before || github.event.repository.default_branch }}
          head: ${{ github.sha }}
          # --only-verified, matching feature-check.yml. Without it the action
          # fails (exit 183) on ANY hit, verified or not, and the RailwayApp
          # detector fires on every UUID sitting near the word "railway" — the
          # --service id in deploy.yml and the pip cache-mount ids in
          # backend/Dockerfile are service identifiers, not credentials. A real
          # leaked token authenticates against the provider and still fails here.
          extra_args: --only-verified

  codeql:
    name: 🔍 CodeQL Deep SAST (Python + Dart)
    runs-on: ubuntu-latest
    needs: secret-scan
    permissions:
      security-events: write
      actions: read
      contents: read
    strategy:
      matrix:
        language: [python]   # Dart CodeQL not yet supported — flutter analyze covers it
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4
        with:
          category: /language:${{ matrix.language }}

  container-scan:
    name: 🐳 Container Scan (Trivy)
    runs-on: ubuntu-latest
    needs: secret-scan
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Build Docker image for scanning
        run: |
          docker build -t cropsphere-backend:ci ./backend

      - name: Run Trivy vulnerability scan
        uses: aquasecurity/trivy-action@v0.35.0
        with:
          image-ref: cropsphere-backend:ci
          format: table
          exit-code: 1           # Fail on HIGH or CRITICAL
          severity: HIGH,CRITICAL
          ignore-unfixed: true

  # ═══════════════════════════════════════════════════
  # STAGE 2 — Parallel jobs (all need Stage 1 to pass)
  # ═══════════════════════════════════════════════════

  backend:
    name: 🐍 FastAPI Backend
    runs-on: ubuntu-latest
    needs: [codeql, container-scan]
    permissions:
      contents: read
      security-events: write   # required by upload-sarif (Snyk results)
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          # CPU-only torch first (matches Dockerfile pin) — pre-satisfying the
          # resolver stops requirements.txt deps from pulling multi-GB CUDA torch
          pip install torch==2.13.0 --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements.txt
          pip install pytest pytest-cov pytest-asyncio httpx \
                      flake8 black bandit pip-audit

      - name: Validate required secrets exist
        run: |
          [ -z "$SECRET_KEY" ] && echo "❌ SECRET_KEY missing" && exit 1
          echo "✅ Environment variables present"
        env:
          SECRET_KEY: ${{ secrets.SECRET_KEY }}

      - name: Lint with flake8
        run: python -m flake8 app/ tests/ --max-line-length=88

      - name: Format check with black
        run: black --check app/ tests/

      - name: SAST with bandit
        run: bandit -r app/ -ll -ii

      - name: Upgrade pip
        run: python -m pip install --upgrade pip==26.2.1

      - name: Dependency vulnerability scan (pip-audit)
        # No --ignore-vuln suppressions: every advisory the old list muted is
        # now fixed by an installed version, so the gate runs clean and fully
        # armed. The chain that unblocked the last two:
        #   torch 2.12.1 -> 2.13.0    fixes GHSA-rrmf-rvhw-rf47 (PYSEC-2025-194),
        #                             and drops torch's `setuptools<82` cap,
        #                             which in turn allows...
        #   setuptools 81.0.0 -> 83.0.0  fixes PYSEC-2026-3447.
        # The rest (torch <=2.10, transformers <5.0.0, joblib <=1.4.2) were
        # stale — the pinned versions had already moved past them.
        # If a new advisory lands, prefer upgrading; only suppress with the
        # affected package, the reason, and a re-check date written down.
        run: python -m pip_audit

      - name: Snyk SCA scan
        # Pinned to a commit SHA — `@master` is a moving target on a
        # third-party action, so a compromised push would run here unreviewed.
        uses: snyk/actions/python@12140f4059e244892ae643824a95459a102120dd
        continue-on-error: true       # Non-blocking — report only
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        with:
          # `defaults.run.working-directory` does NOT apply to `uses:` steps —
          # this action starts at the repo root, so the manifest needs the
          # backend/ prefix or Snyk finds nothing to scan.
          args: >-
            --file=backend/requirements.txt
            --package-manager=pip
            --severity-threshold=high
            --sarif-file-output=snyk.sarif

      - name: Upload Snyk results to GitHub Security
        uses: github/codeql-action/upload-sarif@v4
        # Same reason: the SARIF lands at the repo root, not backend/. The old
        # hashFiles('backend/snyk.sarif') never matched, so Snyk findings were
        # silently never uploaded.
        if: always() && hashFiles('snyk.sarif') != ''
        with:
          sarif_file: snyk.sarif

      - name: Run pytest with coverage
        run: |
          pytest tests/ -v \
            --cov=app \
            --cov-report=term-missing \
            --cov-report=html \
            --cov-fail-under=70
        env:
          FIREBASE_CREDENTIALS_JSON: '{"type":"service_account","project_id":"ci-test","private_key_id":"test","private_key":"-----BEGIN RSA PRIVATE KEY-----\nMIIEowIBAAKCAQEA0Z3VS5JJcds3xHn/ygWep4sOsxKdBkSl7u6v/KHrVhxmVt9E\nHBw1AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA\n-----END RSA PRIVATE KEY-----\n","client_email":"test@ci-test.iam.gserviceaccount.com","client_id":"123","auth_uri":"https://accounts.google.com/o/oauth2/auth","token_uri":"https://oauth2.googleapis.com/token"}'
          FIREBASE_PROJECT_ID: ci-test-project
          GROQ_API_KEY: ci-test-key
          ALLOWED_ORIGINS: http://localhost:3000
          MODEL_DIR: /tmp/models
          SECRET_KEY: ${{ secrets.SECRET_KEY }}

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage
          path: backend/htmlcov/

  ml:
    name: 🤖 ML Pipeline
    runs-on: ubuntu-latest
    needs: [codeql, container-scan]
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          # CPU-only torch first (matches Dockerfile pin) — see backend job
          pip install torch==2.13.0 --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements.txt
          pip install pytest pytest-cov flake8 black bandit pip-audit \
                      great-expectations

      - name: Lint with flake8
        run: python -m flake8 app/services/ --max-line-length=88

      - name: Format check with black
        run: black --check app/services/

      - name: SAST with bandit (ML services)
        run: bandit -r app/services/ -ll

      - name: Upgrade pip
        run: python -m pip install --upgrade pip==26.2.1

      - name: Dependency vulnerability scan (pip-audit)
        # Suppression list retired — see the backend job for the full rationale.
        run: pip-audit -r requirements.txt

      - name: Validate ML model tests
        # Scoped to the five ML model services (M1-M5) — this job validates the
        # models, not the whole app. Two things make that scoping explicit:
        #   -o addopts=""  overrides pyproject's `--cov=app`. pytest-cov ACCUMULATES
        #                  --cov flags, so without this the CLI --cov below would
        #                  widen coverage to the entire app instead of narrowing it,
        #                  and every non-ML feature shipped would drag this gate down.
        #   --cov=<module> dotted module paths, because the services moved out of
        #                  app/services/ (now empty) into app/user/services/.
        # M6 (chatbot RAG) is deliberately excluded: it is gated by the backend
        # job's full-suite 70% threshold, not by the ML model job.
        run: |
          pytest tests/ -v -o addopts="" \
            -k "yield or weather or price or demand or recommend" \
            --cov=app.user.services.yield_service \
            --cov=app.user.services.weather_service \
            --cov=app.user.services.price_service \
            --cov=app.user.services.demand_service \
            --cov=app.user.services.recommend_service \
            --cov-report=term-missing \
            --cov-report=html \
            --cov-fail-under=60
        env:
          FIREBASE_CREDENTIALS_JSON: '{"type":"service_account","project_id":"ci-test","private_key_id":"test","private_key":"-----BEGIN RSA PRIVATE KEY-----\nMIIEowIBAAKCAQEA0Z3VS5JJcds3xHn/ygWep4sOsxKdBkSl7u6v/KHrVhxmVt9E\nHBw1AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA\n-----END RSA PRIVATE KEY-----\n","client_email":"test@ci-test.iam.gserviceaccount.com","client_id":"123","auth_uri":"https://accounts.google.com/o/oauth2/auth","token_uri":"https://oauth2.googleapis.com/token"}'
          FIREBASE_PROJECT_ID: ci-test-project
          GROQ_API_KEY: ci-test-key
          ALLOWED_ORIGINS: http://localhost:3000
          MODEL_DIR: /tmp/models

      - name: Upload ML coverage report
        uses: actions/upload-artifact@v4
        with:
          name: ml-coverage
          path: backend/htmlcov/

  frontend:
    name: 🦋 Flutter Frontend
    runs-on: ubuntu-latest
    needs: [codeql, container-scan]
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.44.8"
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Check for outdated dependencies
        run: flutter pub outdated >> $GITHUB_STEP_SUMMARY
        continue-on-error: true   # Informational only

      - name: Fail on major-version-behind direct dependencies
        # Minor/patch drift is normal and stays non-blocking (the step above).
        # A direct dependency a full major version behind is the kind of
        # drift that quietly turns into a security or compatibility problem
        # if nobody's watching pub outdated's step-summary output — so this
        # one actually fails the job. Only "direct" (pubspec.yaml-declared)
        # packages are checked; transitive drift is the direct package's
        # problem to surface when it in turn updates.
        run: |
          python3 - <<'PY'
          import json, os, subprocess, sys

          result = subprocess.run(
              ["flutter", "pub", "outdated", "--json"],
              capture_output=True, text=True, check=True,
          )
          data = json.loads(result.stdout)

          def major(version):
              return int(version.split("+")[0].split("-")[0].split(".")[0])

          behind = []
          for pkg in data.get("packages", []):
              if pkg.get("kind") != "direct":
                  continue
              current, latest = pkg.get("current"), pkg.get("latest")
              if not current or not latest:
                  continue
              if major(latest["version"]) > major(current["version"]):
                  behind.append((pkg["package"], current["version"], latest["version"]))

          if behind:
              lines = [
                  "## ⚠️ Direct dependencies a major version behind",
                  "",
                  "| Package | Current | Latest |",
                  "|---|---|---|",
              ]
              for name, cur, lat in behind:
                  lines.append(f"| {name} | {cur} | {lat} |")
                  print(
                      f"::error title=Major version behind::{name} is on "
                      f"{cur}, latest is {lat} — review breaking changes "
                      "before upgrading (see pubspec.yaml)"
                  )
              summary = os.environ.get("GITHUB_STEP_SUMMARY")
              if summary:
                  with open(summary, "a") as f:
                      f.write("\n".join(lines) + "\n")
              sys.exit(1)

          print("No direct dependency is a major version behind.")
          PY

      - name: Dart format check
        run: dart format --output=none --set-exit-if-changed .

      - name: Flutter analyze (lint)
        run: flutter analyze

      # A shared helper only helps if screens actually use it. Five screens
      # had each grown a private copy of the week/season helpers, and when
      # the season moved from weeks to months one copy was missed — leaving
      # the dashboard showing Yala tips while a widget on that same dashboard
      # sent 'Inter' to the API. Two review rounds found copies by hand; this
      # finds the next one for free.
      - name: No private copies of the shared date helpers
        run: |
          if grep -rnE '^[[:space:]]*(int _weekOfYear|String _currentSeason)\(' lib; then
            echo "::error::Use farmWeekOfYear()/farmCurrentSeason() from lib/utils/farm_context.dart instead of a private copy."
            exit 1
          fi
          echo "No private date helpers found."

      - name: Run Flutter tests with coverage
        run: flutter test --coverage

      - name: Upload Flutter coverage
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: flutter-coverage
          path: frontend/coverage/

  # ═══════════════════════════════════════════════════
  # STAGE 3 — Final gate (all Stage 2 jobs must pass)
  # ═══════════════════════════════════════════════════

  ci-gate:
    name: ✅ CI Gate
    runs-on: ubuntu-latest
    needs: [backend, ml, frontend]
    if: always()                        # always runs regardless of above jobs
    steps:
      - name: All checks passed
        run: |
          echo "backend:   ${{ needs.backend.result }}"
          echo "ml:        ${{ needs.ml.result }}"
          echo "frontend:  ${{ needs.frontend.result }}"

          if [[ "${{ needs.backend.result }}"  != "success" || \
                "${{ needs.ml.result }}"       != "success" || \
                "${{ needs.frontend.result }}" != "success" ]]; then
            echo "❌ One or more checks failed."
            exit 1
          fi

          echo "✅ All CI checks passed — safe to merge or deploy"
