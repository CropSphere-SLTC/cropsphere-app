name: 🔍 Feature Branch Checks

on:
  push:
    branches:
      - "feature/**"
  pull_request:
    branches:
      - "feature/**"
    types: [opened, synchronize, reopened]
  workflow_dispatch:    # manual trigger from GitHub UI

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true  # always true for feature branches, safe

# Least privilege for GITHUB_TOKEN — nothing here writes back to the repo.
permissions:
  contents: read

jobs:
  # ─────────────────────────────────────────────
  # JOB 1 — Secret Scanning (Gate)
  # All other jobs depend on this passing first
  # ─────────────────────────────────────────────
  secret-scan:
    name: 🔐 Secret Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false   # don't leave the token in .git/config

      - name: TruffleHog — Scan for leaked secrets
        # Pinned to a release tag (same as ci.yml). `@main` was a moving ref on
        # a third-party action: any push to their default branch would execute
        # here unreviewed, with the repo checked out. Versioned tags DO exist —
        # v3.96.0 is the newest; v3.94.3 matches what ci.yml already runs.
        uses: trufflesecurity/trufflehog@v3.94.3
        with:
          path: ./
          base: ${{ github.event.repository.default_branch }}
          head: HEAD
          extra_args: --only-verified

  # ─────────────────────────────────────────────
  # JOB 2 — Backend Checks
  # Runs only if secret-scan passes
  # ─────────────────────────────────────────────
  backend-checks:
    name: 🐍 Backend Checks
    runs-on: ubuntu-latest
    needs: secret-scan
    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # CPU-only torch first (matches Dockerfile pin) — pre-satisfying the
          # resolver stops requirements.txt deps from pulling multi-GB CUDA torch
          pip install torch==2.13.0 --index-url https://download.pytorch.org/whl/cpu
          pip install flake8 pip-audit pytest pytest-cov
          pip install -r requirements.txt

      - name: Lint with Flake8
        run: |
          flake8 app/ tests/ --max-line-length=88

      - name: Dependency vulnerability scan with pip-audit
        # No --ignore-vuln suppressions — all of them are now resolved by the
        # pinned versions, so the gate runs fully armed (matches ci.yml):
        #   setuptools 83.0.0        fixes PYSEC-2026-3447
        #   transformers 5.5.4       past CVE-2026-1839 + PYSEC-2025-211..218
        #   torch 2.13.0             past PYSEC-2026-139
        #   joblib 1.5.3             past PYSEC-2024-277
        # Prefer an upgrade over a new suppression; if one is unavoidable,
        # record the package, the reason, and a re-check date next to it.
        run: pip-audit -r requirements.txt

      - name: Run tests with pytest
        run: |
          pytest tests/ -v --tb=short
        env:
          APP_ENV: test
          FIREBASE_CREDENTIALS_JSON: "{}"
          FIREBASE_PROJECT_ID: test-project
          GROQ_API_KEY: test-key
          MODEL_DIR: /tmp/models

  # ─────────────────────────────────────────────
  # JOB 3 — Frontend Checks
  # Runs only if secret-scan passes
  # Runs in parallel with backend-checks
  # ─────────────────────────────────────────────
  frontend-checks:
    name: 🦋 Frontend Checks
    runs-on: ubuntu-latest
    needs: secret-scan
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.41.9"
          channel: "stable"
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Flutter analyze — static analysis
        run: flutter analyze --fatal-infos --fatal-warnings

      - name: Check outdated packages
        run: flutter pub outdated
        continue-on-error: true

      - name: Install OSV Scanner
        # Pinned + checksum-verified. Previously this pulled `releases/latest`
        # with no integrity check and wrote it straight to /usr/local/bin —
        # whatever that URL served got executed. The hash below is the one
        # published in osv-scanner_SHA256SUMS for v2.4.0; update both together.
        env:
          OSV_VERSION: v2.4.0
          OSV_SHA256: 15314940c10d26af9c6649f150b8a47c1262e8fc7e17b1d1029b0e479e8ed8a0
        run: |
          set -euo pipefail
          curl -fsSL "https://github.com/google/osv-scanner/releases/download/${OSV_VERSION}/osv-scanner_linux_amd64" \
            -o /tmp/osv-scanner
          echo "${OSV_SHA256}  /tmp/osv-scanner" | sha256sum -c -
          chmod +x /tmp/osv-scanner
          mv /tmp/osv-scanner /usr/local/bin/osv-scanner   # runner user owns /usr/local/bin

      - name: OSV Scanner — dependency vulnerability scan
        run: |
          osv-scanner --lockfile=pubspec.lock

  # ─────────────────────────────────────────────
  # JOB 4 — Final Gate
  # Only passes if ALL jobs above passed
  # ─────────────────────────────────────────────
  all-checks-passed:
    name: ✅ All Checks Passed
    runs-on: ubuntu-latest
    needs: [secret-scan, backend-checks, frontend-checks]
    if: always()

    steps:
      - name: Verify all jobs passed
        run: |
          echo "secret-scan:      ${{ needs.secret-scan.result }}"
          echo "backend-checks:   ${{ needs.backend-checks.result }}"
          echo "frontend-checks:  ${{ needs.frontend-checks.result }}"

          if [[ "${{ needs.secret-scan.result }}"     != "success" || \
                "${{ needs.backend-checks.result }}"  != "success" || \
                "${{ needs.frontend-checks.result }}" != "success" ]]; then
            echo "❌ One or more checks failed."
            exit 1
          fi

          echo "✅ All checks passed."
