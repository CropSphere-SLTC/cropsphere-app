# Deploy each frontend PR to a throwaway Firebase Hosting preview channel and
# comment the URL on the PR.
#
# Originally generated by the Firebase CLI as a Node.js template (`npm ci`,
# no build step) — rewritten for Flutter, matching the live-deploy workflow.

name: Deploy to Firebase Hosting on PR

on:
  pull_request:
    # Backend-only PRs get no preview — there would be nothing to look at.
    paths:
      - "frontend/**"
      - ".github/workflows/firebase-hosting-pull-request.yml"

# A new push to the PR supersedes the preview being built for the old commit.
concurrency:
  group: firebase-hosting-preview-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  checks: write
  contents: read
  pull-requests: write

jobs:
  build_and_preview:
    name: 🔎 Build & deploy preview
    # Forks cannot read repository secrets, so the deploy would fail on an
    # empty service account. Skip rather than post a red check on the PR.
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          # Kept in step with firebase-hosting-merge.yml: a preview must be
          # built exactly the way the live site will be.
          flutter-version: "3.44.8"
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Build web bundle
        run: flutter build web --release

      - name: Deploy to preview channel
        uses: FirebaseExtended/action-hosting-deploy@v0
        # entryPoint: see the note in firebase-hosting-merge.yml — actions do
        # not inherit defaults.working-directory.
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_CROPSPHERE_2E87C }}
          projectId: cropsphere-2e87c
          entryPoint: frontend
          expires: 7d
